<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Triathlon Logboek</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#111827}main{max-width:680px;margin:auto;padding:18px 16px 90px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin:12px 0}h1{font-size:26px}label{font-size:12px;color:#6b7280;display:block;margin-bottom:5px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:12px;margin-bottom:10px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}button{width:100%;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;gap:8px;padding:8px}.nav button{background:#eef2f7;color:#111827}.hidden{display:none}.muted{color:#6b7280;font-size:14px}.ok{color:#15803d;font-weight:700}</style></head><body><main><h1>Triathlon Logboek</h1><p class="muted">Je training invullen in minder dan 1 minuut.</p><section id="home"><div class="card"><h2>Vandaag</h2><div id="today"></div></div><div class="card"><h2>Training opslaan</h2><form id="form"><div class="grid"><div><label>Datum</label><input id="date" type="date" required></div><div><label>Sport</label><select id="sport"><option>Fietsen</option><option>Zwemmen</option><option>Lopen</option><option>Kracht</option></select></div><div class="full"><label>Trainingstype</label><input id="type"></div><div><label>Duur (min)</label><input id="duration" type="number"></div><div><label>Afstand (km)</label><input id="distance" type="number" step="0.1"></div><div><label>Gem. HR</label><input id="hr" type="number"></div><div><label>Gem. watt</label><input id="power" type="number"></div><div><label>Pace (min/km)</label><input id="pace"></div><div><label>/100m (min)</label><input id="swim" ></div><div><label>Cadans</label><input id="cadence" type="number"></div><div><label>RPE</label><select id="rpe"><option></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div><div class="full"><label>Opmerking</label><textarea id="notes"></textarea></div></div><button>Training opslaan</button></form><p id="status" class="muted"></p></div></section><section id="settings" class="hidden"><div class="card"><h2>Google Sheets koppeling</h2><p class="muted">Plak hier de Web App URL van Google Apps Script.</p><input id="endpoint" placeholder="https://script.google.com/macros/s/.../exec"><button id="save">Koppeling opslaan</button></div></section></main><div class="nav"><button onclick="show('home')">Vandaag</button><button onclick="show('settings')">Instellingen</button></div><script>const plan=[['2026-10-02','Lopen + kracht','40\' run + 20\' strength'],['2026-10-05','Z2 fiets + core','75\' bike + 15\' core'],['2026-10-06','Zwemmen + rustig lopen','45\' + 25\''],['2026-10-07','Tempo + kracht','65\' + 15\''],['2026-10-08','Zwemtraining','50\''],['2026-10-09','Rustig lopen + kracht','40\' + 25\''],['2026-10-12','Z2 fiets + core','80\' + 10\''],['2026-10-13','Zwemmen + rustig lopen','50\' + 30\''],['2026-10-14','Tempo + kracht','70\' + 15\''],['2026-10-15','Zwemtraining','55\''],['2026-10-16','Rustig lopen + kracht','40\' + 20\''],['2026-10-19','Recovery/Z2 fiets','60\''],['2026-10-20','Easy','45\' + 25\''],['2026-10-21','Easy bike','60\''],['2026-10-22','Easy techniek/endurance','45\''],['2026-10-23','Easy','35\' + 20\'']];const d=new Date().toISOString().slice(0,10);date.value=d;endpoint.value=localStorage.getItem('tri_endpoint')||'';let s=plan.find(x=>x[0]===d);today.innerHTML=s?`<b>${s[1]}</b><br><span class="muted">${s[2]}</span>`:'<span class="muted">Geen geplande training vandaag.</span>';if(s)type.value=s[1];function show(x){home.classList.toggle('hidden',x!=='home');settings.classList.toggle('hidden',x!=='settings')}save.onclick=()=>{localStorage.setItem('tri_endpoint',endpoint.value.trim());status.textContent='Koppeling opgeslagen.';status.className='ok'};form.onsubmit=async e=>{e.preventDefault();let dur=+duration.value||0,r=+rpe.value||0;let data={datum:date.value,sport:sport.value,trainingstype:type.value,duur_min:dur,afstand_km:+distance.value||0,gem_hr:+hr.value||0,gem_watt:+power.value||0,pace:pace.value,zwem_100m:swim.value,cadans:+cadence.value||0,rpe:r,training_load:dur*r/10,opmerking:notes.value};let url=localStorage.getItem('tri_endpoint');if(!url){status.textContent='Lokaal opgeslagen. Voeg de koppeling toe bij Instellingen.';status.className='ok';return}status.textContent='Opslaan...';try{await fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify(data)});status.textContent='✅ Training doorgestuurd naar Google Sheets.';status.className='ok';form.reset();date.value=d}catch(err){status.textContent='Kon niet verbinden; probeer opnieuw.'}};</script></body></html>
